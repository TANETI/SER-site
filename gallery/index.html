<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e6e5e0">
<title>에셋 제작 현황 · 가칭 세라프 프로젝트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://srp.issssm.com" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800;900&family=Azeret+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<script src="../assets/js/quota.js" defer></script>
<style>
.top {
  position: sticky; z-index: 20; top: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 var(--gutter); border-bottom: 1px solid var(--z4);
  background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(6px);
}
.top nav { display: flex; overflow-x: auto; gap: 2px; scrollbar-width: none }
.top nav::-webkit-scrollbar { display: none }
.top a { display: flex; align-items: center; min-height: 52px; padding: 0 12px;
  font-size: 13px; font-weight: 700; color: var(--z3); text-decoration: none; white-space: nowrap }
.top a:hover { color: var(--ink); background: var(--sheet) }
.top .here { color: var(--ink); box-shadow: inset 0 -3px 0 var(--mag) }

main { width: min(100%, 1500px); margin-inline: auto; padding: 0 var(--gutter) 72px }
.intro { padding: clamp(28px, 5vw, 52px) 0 22px }
.intro h1 { font-size: clamp(26px, 4vw, 42px); font-weight: 900; letter-spacing: -.03em }
.intro p { max-width: 66ch; margin-top: 14px; color: var(--z2); font-size: 15px }

.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); border: 1px solid var(--z3); background: var(--sheet) }
.kpi div { padding: 14px 16px; border-right: 1px solid var(--rule) }
.kpi div:last-child { border-right: 0 }
.kpi b { display: block; font-family: var(--face-data); font-size: 26px; font-weight: 600; letter-spacing: -.02em }
.kpi b i { font-style: normal; font-size: 15px; color: var(--z4) }
.kpi b.est { font-size: 20px; color: var(--z3) }
.kpi span { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; color: var(--z3) }
.kpi span.note { font-size: 10.5px; font-weight: 400; letter-spacing: 0; color: var(--z4) }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 18px 0 10px }
.tools button {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px;
  border: 1px solid var(--z6); background: transparent; font-size: 13px; font-weight: 700; color: var(--z2); cursor: pointer;
}
.tools button:hover { border-color: var(--z3); background: var(--sheet) }
.tools button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--clear) }
.tools .sp { flex: 1 }

.key { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 12px 14px; border: 1px solid var(--rule); background: var(--sheet); margin-bottom: 22px }
.key span { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--z2) }
.key i { width: 20px; height: 20px; border: 1px solid var(--rule); background-color: var(--clear); flex: none }
.key i.own { background: var(--z8); border-color: var(--z4) }
.key i.edge { border: 2px solid var(--mag) }

.fac { content-visibility: auto; contain-intrinsic-size: auto 640px }
.fac-head {
  position: sticky; z-index: 6; top: 52px;
  display: flex; align-items: center; gap: 10px; padding: 9px 0;
  border-top: 1px solid var(--z4); border-bottom: 1px solid var(--g-rule);
  background: color-mix(in srgb, var(--paper) 95%, transparent); backdrop-filter: blur(6px);
}
.fac-head h2 { font-size: 15px; font-weight: 800; color: var(--g-label) }
.fac-head .n { margin-left: auto; font-family: var(--face-data); font-size: 11px; color: var(--z4) }

/* 인물 행. 좌측 판독점은 스크롤 중에도 고정된다. */
.row { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--rule) }
@media (min-width: 900px) { .row { grid-template-columns: 186px minmax(0, 1fr); gap: 20px } }
.row.hit { background: var(--mag-soft) }
.who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px }
@media (min-width: 900px) { .who { position: sticky; top: 108px; align-self: start; display: block } }
.who .nm { font-size: 15px; font-weight: 800 }
.who .cd { font-family: var(--face-data); font-size: 11px; color: var(--z4) }
.who .sx { font-family: var(--face-text); font-size: 11px; color: var(--z3) }
/* 해치 밀도 = 미보유 비율. 칸을 접어도 부재는 척도로 남는다. */
.who .dens { width: 100%; height: 9px; margin-top: 8px; border: 1px solid var(--rule); background-color: var(--clear) }
.who .dens i { display: block; height: 100%; background: var(--ink) }
.who .num { margin-top: 5px; font-family: var(--face-data); font-size: 11px; color: var(--z2) }
.who .num s { text-decoration: none; color: var(--z4) }

.cells { display: flex; flex-wrap: wrap; gap: 9px }
.shot { width: 76px }
.cell { position: relative; width: 76px; height: 76px; border: 1px solid var(--rule); background-color: var(--clear); overflow: hidden }
.cell.edge { border: 2px solid var(--mag) }
.cell.miss { --hatch-ink: var(--z6) }
.cell.err { background: var(--mag-soft); border-color: var(--mag) }
.cell.err::after { content: "404"; position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--face-data); font-size: 11px; color: var(--mag-ink) }
.cell a { display: block; width: 100%; height: 100% }
.cell a:focus-visible { outline-offset: -3px }
.cell img { width: 100%; height: 100%; object-fit: cover }
.lbl { display: block; margin-top: 4px; font-size: 10px; line-height: 1.35; color: var(--z3) }
.lbl b { font-family: var(--face-data); font-weight: 600; color: var(--z2) }
.shot.off .lbl { color: var(--z4) }
.none { font-family: var(--face-data); font-size: 12px; color: var(--z4) }

.warn { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 18px 0;
  padding: 14px 16px; border: 1px solid var(--mag); background: var(--mag-soft); color: var(--mag-ink); font-size: 14px }
.warn button { min-height: 36px; padding: 0 12px; border: 1px solid var(--mag-ink); background: transparent; color: inherit; font-weight: 700; cursor: pointer }

/* 라이트박스 */
.lb { position: fixed; z-index: 50; inset: 0; display: none; grid-template-rows: minmax(0, 1fr) auto;
  background: color-mix(in srgb, var(--z0) 93%, transparent) }
.lb.on { display: grid }
.lb .stage { display: grid; place-items: center; min-height: 0; padding: 16px }
.lb img { max-width: min(94vw, 900px); max-height: 100%; object-fit: contain; background: var(--z1) }
.lb .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--z2) }
.lb button { display: grid; place-items: center; width: 46px; height: 46px; flex: none;
  border: 1px solid var(--z4); background: transparent; color: var(--z10); font-size: 18px; cursor: pointer }
.lb button:hover { border-color: var(--z8); color: #fff }
.lb .cap { flex: 1; min-width: 0; text-align: center; font-family: var(--face-data); font-size: 12px; color: var(--z9) }
.lb .cap b { font-family: var(--face-text); font-size: 14px; color: var(--clear) }

footer { width: min(100%, 1500px); margin-inline: auto; padding: 22px var(--gutter) 56px;
  border-top: 1px solid var(--z4); font-family: var(--face-data); font-size: 11px; letter-spacing: .06em; color: var(--z4) }
</style>
</head>
<body>
<a class="skip-link" href="#list">본문으로 건너뛰기</a>

<header class="top">
  <nav aria-label="주요 메뉴">
    <a href="../">← 세계관</a>
    <a href="../guidebook/">가이드북</a>
    <a class="here" href="./" aria-current="page">제작 현황</a>
  </nav>
</header>

<main>
  <div class="intro">
    <h1>에셋 제작 현황</h1>
    <p>인물별로 상황번호가 어디까지 나왔는지 봅니다. 진행률의 분모는 <b>번호가 확정된 칸</b>만 셉니다 —
      일상 <span class="data">202~</span>와 NSFW <span class="data">302~</span>는 아직 번호가 배정되지 않아 예상 상한으로 따로 적습니다.</p>
  </div>

  <div class="kpi" id="kpi"></div>

  <div class="tools" id="tools"></div>
  <div class="key">
    <span><i class="own"></i>보유</span>
    <span><i class="hatch d3 miss"></i>미보유 · 번호는 확정</span>
    <span><i class="hatch conflict"></i>해당 없음</span>
    <span><i class="edge"></i>NSFW 대역</span>
  </div>

  <div id="list"></div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="에셋 크게 보기">
  <div class="stage"><img id="lb-img" alt="" loading="eager"></div>
  <div class="bar">
    <button id="lb-prev" type="button" aria-label="이전 에셋">&lsaquo;</button>
    <p class="cap" id="lb-cap"></p>
    <button id="lb-next" type="button" aria-label="다음 에셋">&rsaquo;</button>
    <button id="lb-close" type="button" aria-label="닫기">&times;</button>
  </div>
</div>

<footer>SERAPH PROJECT · ASSET STATUS · 빌드 시각 기준</footer>

<script>
const BASE = 'https://srp.issssm.com';
const BANDS = [
  { key: 'all',    label: '전체',      test: () => true },
  { key: 'emo',    label: '감정 01~25', test: (n) => Number(n) < 100 },
  { key: 'battle', label: '전투·능력',  test: (n) => Number(n) >= 101 && Number(n) < 200 },
  { key: 'daily',  label: '일상 201~',  test: (n) => Number(n) >= 201 && Number(n) < 300 },
  { key: 'nsfw',   label: 'NSFW 301~', test: (n) => Number(n) >= 301 },
];
/* 빈 칸 토글은 사람마다 답이 다르다. 고른 값을 기억한다. */
const PREF = 'ser.gallery.showMiss';
const remember = (v) => { try { localStorage.setItem(PREF, v ? '1' : '0'); } catch {} };
const recall = () => { try { const v = localStorage.getItem(PREF); return v === null ? true : v === '1'; } catch { return true; } };

let band = 'all', showMiss = recall(), people = [], have = {}, names = {};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hatchFor = (ratio) => 'hatch d' + Math.max(1, Math.min(8, Math.round(ratio * 8) || 1));

function fail(message) {
  document.getElementById('kpi').innerHTML = '';
  document.getElementById('tools').innerHTML = '';
  document.getElementById('list').innerHTML =
    '<div class="warn"><span>' + esc(message) + '</span>' +
    '<button type="button" onclick="location.reload()">다시 불러오기</button></div>';
}

async function boot() {
  const load = (url) => fetch(url, { cache: 'no-cache' }).then((r) => {
    if (!r.ok) throw new Error(url + ' → HTTP ' + r.status);
    return r.json();
  });
  try {
    const [cs, as, ns] = await Promise.all([
      load('../data/characters.json'), load('../data/assets.json'), load('../data/shots.json'),
    ]);
    people = cs;
    names = ns;
    have = Object.fromEntries(Object.entries(as)
      .map(([k, v]) => [k, Array.isArray(v) ? { shots: v, sex: null } : v]));
  } catch (error) {
    fail('제작 현황 데이터를 불러오지 못했습니다. 지금 화면의 숫자를 믿지 마세요. (' + error.message + ')');
    return;
  }

  const tools = document.getElementById('tools');
  tools.innerHTML = BANDS.map((b) =>
    '<button type="button" data-band="' + b.key + '" aria-pressed="' + (b.key === band) + '">' + b.label + '</button>').join('') +
    '<span class="sp"></span><button type="button" id="toggle-miss" aria-pressed="' + showMiss + '">빈 칸 보기</button>';
  tools.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.id === 'toggle-miss') {
      showMiss = !showMiss;
      button.setAttribute('aria-pressed', String(showMiss));
      remember(showMiss);
    } else {
      band = button.dataset.band;
      tools.querySelectorAll('[data-band]').forEach((x) =>
        x.setAttribute('aria-pressed', String(x.dataset.band === band)));
    }
    render();
  });
  render();
}

function render() {
  const test = BANDS.find((b) => b.key === band).test;
  let owned = 0, fixedTotal = 0, estTotal = 0;

  const html = SER.GROUPS.map((group) => {
    const members = people.filter((p) => p.group === group.id);
    if (!members.length) return '';
    const rows = members.map((person) => {
      const record = have[person.code] || { shots: [], sex: null };
      const mine = (record.shots || []).filter(test);
      const fixed = SER.fixedShots(person, record.sex).filter(test);
      const cells = [...new Set([...fixed, ...mine])].sort((a, b) => Number(a) - Number(b));
      const missing = cells.filter((s) => !mine.includes(s));
      owned += mine.length;
      fixedTotal += fixed.length;
      if (band === 'all' || band === 'daily' || band === 'nsfw') estTotal += SER.estimateExtra(record.sex);
      const pct = fixed.length ? Math.min(100, Math.round((mine.length / fixed.length) * 100)) : 0;
      const density = cells.length ? missing.length / cells.length : 0;
      const shown = showMiss ? cells : cells.filter((s) => mine.includes(s));

      const body = shown.map((shot) => {
        const url = BASE + '/' + person.code + '/D/' + shot + '.webp';
        const edge = Number(shot) >= 301 ? ' edge' : '';
        const label = names[shot] || '';
        const cap = '<span class="lbl"><b>' + shot + '</b> ' + esc(label) + '</span>';
        if (mine.includes(shot)) {
          return '<div class="shot"><div class="cell' + edge + '">' +
            '<a href="' + url + '" data-code="' + person.code + '" data-shot="' + shot + '">' +
            '<img src="' + url + '" alt="' + esc(person.name + ' ' + (label || shot)) + '" width="1024" height="1024" ' +
            'loading="eager" decoding="async" ' +
            'onerror="this.closest(\'.cell\').classList.add(\'err\');this.remove()"></a></div>' + cap + '</div>';
        }
        return '<div class="shot off"><div class="cell miss hatch d3' + edge + '"></div>' + cap + '</div>';
      }).join('') || '<p class="none">' +
        (showMiss ? '이 대역에 해당하는 칸이 없습니다.' : '이 대역에 보유한 에셋이 없습니다.') + '</p>';

      return '<div class="row" id="' + person.code + '">' +
        '<div class="who">' +
          '<div class="nm">' + esc(person.name) + '</div>' +
          '<div class="cd">' + person.code + (record.sex ? ' <span class="sx">' + esc(record.sex) + '</span>' : '') + '</div>' +
          '<div class="dens ' + (density ? hatchFor(density) : '') + '"><i style="width:' + pct + '%"></i></div>' +
          '<div class="num">' + mine.length + ' / ' + fixed.length + '<s> · 남은 ' + missing.length + '</s></div>' +
        '</div><div class="cells">' + body + '</div></div>';
    }).join('');

    return '<section class="fac" data-grade="' + group.grade + '" aria-labelledby="f-' + group.id + '">' +
      '<div class="fac-head">' + SER.curveSvg(group.grade, group.grade === '—' ? 'solid' : '') +
      '<h2 id="f-' + group.id + '">' + esc(group.label) + '</h2>' +
      '<span class="n">' + members.length + '명</span></div>' + rows + '</section>';
  }).join('');

  document.getElementById('list').innerHTML = html;
  const pct = fixedTotal ? Math.round((owned / fixedTotal) * 100) : 0;
  document.getElementById('kpi').innerHTML =
    '<div><b>' + owned + '<i>/' + fixedTotal + '</i></b><span>보유 / 확정 칸</span></div>' +
    '<div><b>' + pct + '<i>%</i></b><span>확정 칸 진행률</span></div>' +
    '<div><b>' + (fixedTotal - owned) + '</b><span>남은 확정 칸</span></div>' +
    '<div><b class="est">+' + estTotal + '</b><span>예상 상한 추가분</span>' +
    '<span class="note">번호 미배정 · 분모 제외</span></div>';
}

function focusHash() {
  const code = location.hash.replace('#', '');
  if (!code) return;
  const row = document.getElementById(code);
  if (!row) return;
  row.scrollIntoView({ block: 'start', behavior: 'smooth' });
  row.classList.add('hit');
  setTimeout(() => row.classList.remove('hit'), 2400);
}
window.addEventListener('hashchange', focusHash);

/* 라이트박스 */
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lb-img');
const lbCap = document.getElementById('lb-cap');
const lbClose = document.getElementById('lb-close');
let shelf = [], at = 0, opener = null;

const warm = (i) => { const item = shelf[(i + shelf.length) % shelf.length]; if (item) new Image().src = item.url; };

function show(i) {
  at = (i + shelf.length) % shelf.length;
  const item = shelf[at];
  warm(at + 1); warm(at - 1);
  lbImg.src = item.url;
  lbImg.alt = item.name + ' ' + (names[item.shot] || item.shot);
  const label = names[item.shot] ? ' · ' + names[item.shot] : '';
  lbCap.innerHTML = '<b>' + esc(item.name) + '</b>' + esc(label) +
    ' · ' + item.code + ' / D / ' + item.shot + ' · ' + (at + 1) + ' / ' + shelf.length;
}
function openLightbox(code, shot, trigger) {
  const record = have[code] || { shots: [] };
  const name = (people.find((p) => p.code === code) || {}).name || code;
  shelf = (record.shots || []).map((s) => ({ url: BASE + '/' + code + '/D/' + s + '.webp', code, shot: s, name }));
  opener = trigger;
  show(shelf.findIndex((x) => x.shot === shot));
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
  lbClose.focus();
}
function closeLightbox() {
  lb.classList.remove('on');
  lbImg.src = '';
  document.body.style.overflow = '';
  if (opener) opener.focus();
  opener = null;
}
document.addEventListener('click', (event) => {
  const link = event.target.closest('.cells a[data-shot]');
  if (link) { event.preventDefault(); openLightbox(link.dataset.code, link.dataset.shot, link); return; }
  if (event.target.closest('#lb-prev')) { show(at - 1); return; }
  if (event.target.closest('#lb-next')) { show(at + 1); return; }
  if (event.target.closest('#lb-close') || event.target === lb) closeLightbox();
});
let swipeFrom = null;
lb.addEventListener('touchstart', (e) => { swipeFrom = e.changedTouches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', (e) => {
  if (swipeFrom === null) return;
  const dx = e.changedTouches[0].clientX - swipeFrom;
  swipeFrom = null;
  if (Math.abs(dx) > 40) show(dx < 0 ? at + 1 : at - 1);
}, { passive: true });
document.addEventListener('keydown', (event) => {
  if (!lb.classList.contains('on')) return;
  if (event.key === 'Escape') { closeLightbox(); return; }
  if (event.key === 'ArrowLeft') { show(at - 1); return; }
  if (event.key === 'ArrowRight') { show(at + 1); return; }
  if (event.key === 'Tab') {
    const stops = [...lb.querySelectorAll('button')];
    const i = stops.indexOf(document.activeElement);
    event.preventDefault();
    stops[(i + (event.shiftKey ? -1 : 1) + stops.length) % stops.length].focus();
  }
});

boot().then(focusHash);
</script>
</body>
</html>
