<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#10141d">
<title>에셋 제작 현황</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0E1319; --panel:#151B23; --panel2:#1A212A; --line:#27313D;
  --ink:#E8EBEF; --strong:#FBFCFD; --dim:#98A3B1; --faint:#66717E;
  --gold:#C39B4E; --steel:#7396B5; --safe:#5C9C85; --danger:#BF574F;
  --sans:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
  --mono:ui-monospace,"D2Coding",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.6;padding:32px 20px 80px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
.back{display:flex;gap:14px;margin:0 0 18px}
.back a{color:var(--dim);text-decoration:none;font-size:13px;
  padding:6px 12px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.back a:hover{color:var(--strong);border-color:var(--gold)}
.lead{color:var(--dim);margin:0 0 24px;font-size:14px}
.lead code{font-family:var(--mono);color:var(--steel)}

.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}
.sum div{padding:14px 16px 14px 0;border-right:1px solid var(--line)}
.sum div:last-child{border-right:0}
.sum b{display:block;font-size:22px;color:var(--strong);font-variant-numeric:tabular-nums}
.sum span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.bar button{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);
  background:var(--panel);color:var(--dim);border-radius:3px;cursor:pointer}
.bar button:hover{color:var(--ink)}
.bar button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#10141d;font-weight:600}

.grp{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--gold);
  text-transform:uppercase;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}

.row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start;
  padding:14px 0;border-bottom:1px solid var(--line)}
.who .nm{font-size:16px;color:var(--strong);font-weight:600}
.who .cd{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.08em}
.who .pg{margin-top:6px;height:4px;background:var(--panel2);overflow:hidden}
.who .pg i{display:block;height:100%;background:var(--safe)}
.who .sx{font-family:var(--sans);color:var(--dim);font-size:10px;margin-left:4px}
.none{color:var(--faint);font-family:var(--mono);font-size:11px;padding:8px 0}
.who .pct{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px;
  font-variant-numeric:tabular-nums}

.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.shot .lbl{display:block;margin-top:3px;font-size:10.5px;line-height:1.35;color:var(--dim);
  text-align:center;word-break:keep-all}
.shot .lbl b{font-family:var(--mono);color:var(--faint);font-weight:400;margin-right:3px}
.shot.off .lbl{color:var(--faint)}
.cell{position:relative;aspect-ratio:1;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .n{position:absolute;left:2px;bottom:1px;font-family:var(--mono);font-size:9px;
  color:#fff;text-shadow:0 0 3px #000;letter-spacing:.04em}
.cell.miss{background:repeating-linear-gradient(45deg,#131920,#131920 5px,#161D26 5px,#161D26 10px)}
.cell.miss .n{position:static;color:var(--faint);text-shadow:none;font-size:11px}
.cell.nsfw{border-color:var(--danger)}
.cell a{display:block;width:100%;height:100%}

.row{scroll-margin-top:16px}
.row.hit{background:rgba(195,155,78,.07);outline:1px solid var(--gold);outline-offset:6px}

.lb{position:fixed;inset:0;background:rgba(6,9,13,.94);display:none;z-index:50;
  align-items:center;justify-content:center;padding:56px 64px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lb .cap{position:absolute;left:0;right:0;bottom:16px;text-align:center;
  font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.1em}
.lb .cap b{color:var(--strong);font-weight:500}
.lb button{position:absolute;background:none;border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:22px;line-height:1;width:44px;height:44px;cursor:pointer;
  border-radius:3px;background:rgba(21,27,35,.85)}
.lb button:hover{border-color:var(--gold);color:var(--gold)}
.lb .prev{left:12px;top:50%;transform:translateY(-50%)}
.lb .next{right:12px;top:50%;transform:translateY(-50%)}
.lb .close{right:12px;top:12px;font-size:18px}
@media(max-width:640px){
  /* 좁은 화면에서는 화살표가 그림을 덮으므로 아래로 내린다 */
  .lb{padding:40px 10px 100px}
  .lb .prev,.lb .next{top:auto;bottom:18px;transform:none;width:56px;height:46px}
  .lb .prev{left:calc(50% - 88px)}
  .lb .next{right:calc(50% - 88px)}
  .lb .cap{bottom:76px}
}
footer{margin-top:40px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint)}
@media(max-width:640px){
  body{padding:22px 14px 60px}
  .row{grid-template-columns:1fr;gap:10px}
  .sum div{border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="back" aria-label="사이트 메뉴">
    <a href="../">← 세계관 정보</a>
    <a href="../guidebook/">가이드북</a>
  </nav>
  <h1>에셋 제작 현황</h1>
  <p class="lead">제작 확인용 임시 페이지입니다. 예상 물량=감정 <code>25</code> · 변신·전투 <code>3</code> · 일상 <code>7</code> · NSFW <code>36</code>(여성 전용).
  일상과 NSFW는 상황번호가 아직 배정되지 않아 보유분만 칸으로 보입니다. 성별 미확정 인물은 NSFW를 예상치에서 제외합니다.</p>

  <div class="sum" id="sum"></div>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="에셋 크게 보기">
    <button class="prev" type="button" aria-label="이전">‹</button>
    <img id="lb-img" alt="">
    <button class="next" type="button" aria-label="다음">›</button>
    <button class="close" type="button" aria-label="닫기">✕</button>
    <p class="cap" id="lb-cap"></p>
  </div>
  <footer>SERAPH PROJECT · ASSET STATUS · 빌드 시각 기준</footer>
</div>

<script>
const BASE = 'https://srp.issssm.com';
const FIXED = [
  ...Array.from({length:25},(_,i)=>String(i+1).padStart(2,'0')),
  '101','102','103'
];
const QUOTA = {emo:25, battle:3, daily:7, nsfw:36};
// 집단마다 쓰는 번호가 다르다. 변신하지 않는 쪽은 101·103이 없다
const BY_GROUP = {
  seraph:  ['102'],
  gardener:['102','103'],
  core:    ['130'],
  church:  ['102','103','104','105','106']
};
const OWN = {JR:['120']};            // 예로니모의 고유 클라비스
const DAILY = ['201'];               // 번호가 배정된 일상 에셋
const battleSet = (p) => [...(BY_GROUP[p.group] || ['101','102','103']), ...(OWN[p.code] || [])];
const BANDS = [
  {key:'all',    label:'전체',       test:()=>true},
  {key:'emo',    label:'감정 01~25',  test:n=>Number(n)<100},
  {key:'battle', label:'전투·능력',   test:n=>Number(n)>=101&&Number(n)<200},
  {key:'daily',  label:'일상 201~',   test:n=>Number(n)>=201&&Number(n)<300},
  {key:'nsfw',   label:'NSFW 301~',  test:n=>Number(n)>=301}
];
let band = 'all', people = [], have = {}, names = {};

function quotaFor(rec, key, person){
  const female = rec.sex === '여성';
  const unknown = !rec.sex;
  const battle = battleSet(person).length;
  if(key === 'battle') return battle;
  if(key === 'nsfw') return unknown ? null : (female ? QUOTA.nsfw : 0);
  if(key === 'all'){
    const n = QUOTA.emo + battle + QUOTA.daily;
    return unknown ? n : n + (female ? QUOTA.nsfw : 0);
  }
  return QUOTA[key];
}

async function boot(){
  // 캐시된 옛 형식이 섞이지 않도록 항상 재검증한다
  const load = (u) => fetch(u, {cache:'no-cache'}).then(r=>r.json());
  const [cs, as, ns] = await Promise.all([
    load('../data/characters.json'),
    load('../data/assets.json').catch(()=>({})),
    load('../data/shots.json').catch(()=>({}))
  ]);
  names = ns;
  people = cs;
  // 배열 형식(구버전)도 받아들인다
  have = Object.fromEntries(Object.entries(as).map(([k,v]) =>
    [k, Array.isArray(v) ? {shots:v, sex:null} : v]));
  document.getElementById('bar').innerHTML = BANDS.map(b =>
    `<button type="button" data-band="${b.key}" aria-pressed="${b.key===band}">${b.label}</button>`).join('');
  document.getElementById('bar').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    band = b.dataset.band;
    document.querySelectorAll('#bar button').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.band===band)));
    render();
  });
  render();
}

function render(){
  const test = BANDS.find(b=>b.key===band).test;
  let owned = 0, quota = 0, done = 0;
  const groups = {};
  for(const p of people){
    const rec = have[p.code] || {shots:[], sex:null};
    const mine = (rec.shots||[]).filter(test);
    const q = quotaFor(rec, band, p);
    owned += mine.length;
    if(q !== null) quota += q;
    if(q !== null && q > 0 && mine.length >= q) done++;
    // 칸=배정된 번호(감정·변신전투) + 실제 보유분
    const fixed = [...FIXED.filter(s => Number(s) < 100), ...battleSet(p), ...DAILY];
    const cells = [...new Set([...fixed.filter(test), ...mine])]
      .sort((a,b)=>Number(a)-Number(b));
    (groups[p.groupLabel] ||= []).push({p, rec, mine, q, cells});
  }
  const pct = quota ? Math.round(owned/quota*100) : 0;
  document.getElementById('sum').innerHTML = `
    <div><b>${people.length}</b><span>인물</span></div>
    <div><b>${owned}<span style="color:var(--faint)">/${quota}</span></b><span>보유 / 예상</span></div>
    <div><b>${pct}%</b><span>진행률</span></div>
    <div><b>${done}</b><span>예상치 도달</span></div>`;

  document.getElementById('list').innerHTML = Object.entries(groups).map(([label, rows]) => `
    <div class="grp">${label}</div>
    ${rows.map(({p, rec, mine, q, cells}) => {
      const width = q ? Math.min(100, mine.length/q*100) : 0;
      const note = q === null ? '성별 미확정' : `${mine.length} / ${q}`;
      const sex = rec.sex ? `<span class="sx">${rec.sex}</span>` : '';
      return `
      <div class="row" id="${p.code}">
        <div class="who">
          <div class="nm">${p.name}</div>
          <div class="cd">${p.code} ${sex}</div>
          <div class="pg"><i style="width:${width}%"></i></div>
          <div class="pct">${note}</div>
        </div>
        <div class="cells">
          ${cells.map(s => {
            const url = `${BASE}/${p.code}/D/${s}.webp`;
            const nsfw = Number(s) >= 301 ? ' nsfw' : '';
            const label = names[s] || '';
            const cap = `<span class="lbl"><b>${s}</b>${label}</span>`;
            return mine.includes(s)
              ? `<div class="shot"><div class="cell${nsfw}">
                   <a href="${url}" data-code="${p.code}" data-shot="${s}" title="${label}">
                   <img src="${url}" alt="${p.name} ${label}" loading="lazy" decoding="async"></a>
                   </div>${cap}</div>`
              : `<div class="shot off"><div class="cell miss${nsfw}"></div>${cap}</div>`;
          }).join('') || '<div class="none">배정된 번호 없음</div>'}
        </div>
      </div>`;}).join('')}`).join('');
}

// ── 앵커로 들어온 인물 강조
function focusHash(){
  const code = location.hash.replace('#','');
  if(!code) return;
  const row = document.getElementById(code);
  if(!row) return;
  row.scrollIntoView({block:'start', behavior:'smooth'});
  row.classList.add('hit');
  setTimeout(()=>row.classList.remove('hit'), 2400);
}
window.addEventListener('hashchange', focusHash);

// ── 라이트박스
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lb-img');
const lbCap = document.getElementById('lb-cap');
let shelf = [], at = 0, who = '';

function warm(i){
  const item = shelf[(i + shelf.length) % shelf.length];
  if(item){ const im = new Image(); im.src = item.url; }
}
function show(i){
  at = (i + shelf.length) % shelf.length;
  const {url, code, shot, name} = shelf[at];
  warm(at + 1); warm(at - 1);
  lbImg.src = url;
  lbImg.alt = `${name} ${shot}`;
  const label = names[shot] ? ` · ${names[shot]}` : '';
  lbCap.innerHTML = `<b>${name}</b>${label} · ${code} / D / ${shot} · ${at+1} / ${shelf.length}`;
}
function open(code, shot){
  const rec = have[code] || {shots:[]};
  const name = (people.find(p=>p.code===code)||{}).name || code;
  shelf = (rec.shots||[]).map(s => ({url:`${BASE}/${code}/D/${s}.webp`, code, shot:s, name}));
  who = code;
  show(shelf.findIndex(x=>x.shot===shot));
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function close(){
  lb.classList.remove('on');
  lbImg.src = '';
  document.body.style.overflow = '';
}
document.addEventListener('click', e => {
  const link = e.target.closest('.cells a[data-shot]');
  if(link){ e.preventDefault(); open(link.dataset.code, link.dataset.shot); return; }
  if(e.target.closest('.lb .prev')){ show(at-1); return; }
  if(e.target.closest('.lb .next')){ show(at+1); return; }
  if(e.target.closest('.lb .close') || e.target === lb){ close(); }
});
// 좌우 스와이프로도 넘긴다
let swipeFrom = null;
lb.addEventListener('touchstart', e => { swipeFrom = e.changedTouches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', e => {
  if(swipeFrom === null) return;
  const dx = e.changedTouches[0].clientX - swipeFrom;
  swipeFrom = null;
  if(Math.abs(dx) > 40) show(dx < 0 ? at + 1 : at - 1);
}, {passive:true});

document.addEventListener('keydown', e => {
  if(!lb.classList.contains('on')) return;
  if(e.key === 'Escape') close();
  if(e.key === 'ArrowLeft') show(at-1);
  if(e.key === 'ArrowRight') show(at+1);
});

boot().then(focusHash);
</script>
</body>
</html>
